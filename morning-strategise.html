<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Strategise has moved</title>
<meta name="robots" content="noindex">
<script>
  // Morning Strategise now lives at strategy.gwstudio.com.au.
  // Carry any saved settings across (browsers keep storage per address).
  (function () {
    var target = "https://strategy.gwstudio.com.au/";
    try {
      var data = {};
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (/^ms_/.test(k)) data[k] = localStorage.getItem(k);
      }
      if (Object.keys(data).length) target += "#import=" + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    } catch (e) {}
    location.replace(target);
  })();
</script>
</head>
<body style="font-family:-apple-system,system-ui,sans-serif;background:#111;color:#eee;display:grid;place-items:center;min-height:100vh;margin:0">
  <p>Morning Strategise has moved to <a style="color:#fbb33c" href="https://strategy.gwstudio.com.au/">strategy.gwstudio.com.au</a>.</p>
</body>
</html>
